suite: service account
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
release:
  name: demo
set:
  components.backend.enabled: true
  components.backend.image.repository: ghcr.io/lyrolab/demo-backend
tests:
  - it: renders no ServiceAccount and keeps the namespace default by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: templates/deployment.yaml

  - it: creates a ServiceAccount carrying the pull secrets and runs pods as it
    set:
      serviceAccount.create: true
      serviceAccount.imagePullSecrets:
        - github-registry
    asserts:
      - isKind:
          of: ServiceAccount
        template: templates/serviceaccount.yaml
      - equal:
          path: metadata.name
          value: demo-app-chart
        template: templates/serviceaccount.yaml
      - equal:
          path: imagePullSecrets
          value:
            - name: github-registry
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: demo-app-chart
        template: templates/deployment.yaml

  - it: names the created ServiceAccount after serviceAccount.name
    set:
      serviceAccount.create: true
      serviceAccount.name: demo-runtime
    asserts:
      - equal:
          path: metadata.name
          value: demo-runtime
        template: templates/serviceaccount.yaml
      - notExists:
          path: imagePullSecrets
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: demo-runtime
        template: templates/deployment.yaml

  - it: points pods at an existing ServiceAccount without creating one
    set:
      serviceAccount.name: shared-runtime
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shared-runtime
        template: templates/deployment.yaml

  - it: never sets imagePullSecrets on the pod spec
    set:
      serviceAccount.create: true
      serviceAccount.imagePullSecrets:
        - github-registry
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: templates/deployment.yaml
