suite: component secrets
templates:
  - templates/deployment.yaml
release:
  name: demo
set:
  components.backend.enabled: true
  components.backend.image.repository: ghcr.io/lyrolab/demo-backend
  components.frontend.enabled: true
  components.frontend.image.repository: ghcr.io/lyrolab/demo-frontend
tests:
  - it: mounts the convention secret as optional on every component
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: demo-app-chart-backend-secrets
                optional: true
        documentSelector:
          path: metadata.name
          value: demo-app-chart-backend
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: demo-app-chart-frontend-secrets
                optional: true
        documentSelector:
          path: metadata.name
          value: demo-app-chart-frontend

  - it: mounts the convention secret on init containers too
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: demo-app-chart-backend-secrets
                optional: true
        documentSelector:
          path: metadata.name
          value: demo-app-chart-backend

  - it: follows fullnameOverride in the convention name
    set:
      fullnameOverride: lyrochat
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: lyrochat-backend-secrets
        documentSelector:
          path: metadata.name
          value: lyrochat-backend

  - it: mounts an explicit secretName as required
    set:
      components.backend.secretName: backend-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: backend-env
        documentSelector:
          path: metadata.name
          value: demo-app-chart-backend
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: backend-env
        documentSelector:
          path: metadata.name
          value: demo-app-chart-backend
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: demo-app-chart-frontend-secrets
        documentSelector:
          path: metadata.name
          value: demo-app-chart-frontend
