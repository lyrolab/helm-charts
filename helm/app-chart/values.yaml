stage: ""
nameOverride: ""
fullnameOverride: ""

defaults:
  # Requests size the node pool; limits only cap burst. Requests stay small so
  # scheduling cost is unchanged, while the CPU limit is wide enough that a
  # container can burn through boot instead of being throttled past its probes.
  resources:
    limits:
      cpu: 1000m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # The startup probe owns boot: liveness and readiness do not run until it
  # passes, so a slow start can never be mistaken for a hung process.
  probes:
    enabled: false
    path: /health
    startup:
      periodSeconds: 5
      failureThreshold: 60
    liveness:
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      failureThreshold: 3
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts: []
  image:
    pullPolicy: IfNotPresent
    tag: latest
  secretName: ""
  autoDetectSecrets: true
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  otel:
    enabled: true
    exporterUrl: "http://otelcol-collector.observability.svc.cluster.local:4317"

components:
  backend:
    enabled: false
    name: backend
    replicaCount: 1
    host: "localhost"
    image:
      repository:
    service:
      targetPort: 3000
    ingress:
      path: "/api(/|$)(.*)"
    resources:
      limits:
        cpu: 1000m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    env:
      PGSSLMODE: no-verify
    otel:
      enabled: true
    probes:
      enabled: true
    initContainers:
      - name: run-migrations
        command: "npm run db:migrate"

  frontend:
    enabled: false
    name: frontend
    replicaCount: 1
    image:
      repository:
    service:
      targetPort: 3000
    resources:
    otel:
      enabled: false
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80

posthog:
  enabled: false
  host: ""

keycloak:
  realm:
