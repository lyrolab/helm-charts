{{- range $componentName, $component := .Values.components }}
{{- if $component.enabled }}
{{- $componentNameValue := $component.name | default $componentName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" $ }}-{{ $componentNameValue }}
  labels:
    {{- include "app.componentLabels" (dict "root" $ "component" $component "name" $componentNameValue) | nindent 4 }}
spec:
  {{- $autoscaling := mergeOverwrite (deepCopy $.Values.defaults.autoscaling) ($component.autoscaling | default dict) }}
  {{- if not $autoscaling.enabled }}
  replicas: {{ $component.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $componentNameValue }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $componentNameValue }}
    spec:
      {{- if or $.Values.serviceAccount.create $.Values.serviceAccount.name }}
      serviceAccountName: {{ include "app.serviceAccountName" $ }}
      {{- end }}
      {{- $secretName := $component.secretName | default (printf "%s-%s-secrets" (include "app.fullname" $) $componentNameValue) }}
      {{- if $component.initContainers }}
      initContainers:
        {{- range $container := $component.initContainers }}
        - name: {{ $container.name }}
          image: "{{ $component.image.repository }}:{{ $component.image.tag | default $.Values.defaults.image.tag }}"
          command: ["sh", "-c", {{ $container.command | toJson }}]
          env:
            {{- if $component.env }}
            {{- range $key, $value := $component.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: APP_STAGE
              value: {{ $.Values.stage | quote }}
            {{- include "app.backendEnvVars" (dict "component" $component "root" $) | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
                {{- if not $component.secretName }}
                optional: true
                {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $componentNameValue }}
          image: "{{ $component.image.repository }}:{{ $component.image.tag | default $.Values.defaults.image.tag }}"
          imagePullPolicy: {{ $component.image.pullPolicy | default $.Values.defaults.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $component.service.targetPort }}
              protocol: TCP
          env:
            {{- if $component.env }}
            {{- range $key, $value := $component.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: APP_STAGE
              value: {{ $.Values.stage | quote }}
            {{- include "app.backendEnvVars" (dict "component" $component "root" $) | nindent 12 }}
            {{- if eq $componentNameValue "frontend" }}
            - name: NEXTAUTH_URL
              value: "https://{{ $component.host }}/auth"
            {{- end}}
            {{- if and (eq $componentNameValue "frontend") ($.Values.components.backend.enabled) }}
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "https://{{ $.Values.components.backend.host }}/api"
            - name: VITE_BACKEND_URL
              value: "https://{{ $.Values.components.backend.host }}/api"
            {{- end }}
            {{- if and (eq $componentNameValue "frontend") ($.Values.keycloak.realm) }}
            - name: NEXT_PUBLIC_KEYCLOAK_REALM
              value: {{ $.Values.keycloak.realm | quote }}
            - name: VITE_KEYCLOAK_REALM
              value: {{ $.Values.keycloak.realm | quote }}
            - name: NEXT_PUBLIC_KEYCLOAK_CLIENT_ID
              value: "app"
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: "app"
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: "https://sso.lyrolab.fr"
            - name: VITE_KEYCLOAK_URL
              value: "https://sso.lyrolab.fr"
            {{- end }}
            {{- if and (eq $componentNameValue "frontend") ($.Values.posthog.enabled) }}
            - name: NEXT_PUBLIC_POSTHOG_HOST
              value: "https://{{ $.Values.posthog.host }}"
            - name: VITE_POSTHOG_HOST
              value: "https://{{ $.Values.posthog.host }}"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
                {{- if not $component.secretName }}
                optional: true
                {{- end }}
          resources:
            {{- if $component.resources }}
            {{- toYaml $component.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.defaults.resources | nindent 12 }}
            {{- end }}
          {{- $probes := mergeOverwrite (deepCopy $.Values.defaults.probes) ($component.probes | default dict) }}
          {{- if $probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ $probes.path }}
              port: http
            periodSeconds: {{ $probes.startup.periodSeconds }}
            failureThreshold: {{ $probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $probes.path }}
              port: http
            periodSeconds: {{ $probes.liveness.periodSeconds }}
            failureThreshold: {{ $probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $probes.path }}
              port: http
            periodSeconds: {{ $probes.readiness.periodSeconds }}
            failureThreshold: {{ $probes.readiness.failureThreshold }}
          {{- end }}
{{- end }}
{{- end }}
