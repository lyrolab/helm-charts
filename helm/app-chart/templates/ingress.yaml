{{- range $componentName, $component := .Values.components }}
{{- $componentNameValue := $component.name | default $componentName }}
{{- $ingressEnabled := false }}
{{- if and (hasKey $component "ingress") (hasKey $component.ingress "enabled") }}
  {{- $ingressEnabled = $component.ingress.enabled }}
{{- else }}
  {{- $ingressEnabled = $.Values.defaults.ingress.enabled }}
{{- end }}
{{- if and $component.enabled $ingressEnabled }}
{{- $fullName := include "app.fullname" $ }}
{{- $svcPort := $.Values.defaults.service.port }}
{{- if hasKey $component "service" }}
  {{- if $component.service.port }}
  {{- $svcPort = $component.service.port }}
  {{- end }}
{{- end }}
{{- $path := "/" }}
{{- if hasKey $component "ingress" }}
  {{- if $component.ingress.path }}
  {{- $path = $component.ingress.path }}
  {{- end }}
{{- end }}
{{- $headers := mergeOverwrite (deepCopy $.Values.defaults.ingress.securityHeaders) (dig "ingress" "securityHeaders" dict $component) }}
{{- $rateLimit := mergeOverwrite (deepCopy $.Values.defaults.ingress.rateLimit) (dig "ingress" "rateLimit" dict $component) }}
{{- $tls := mergeOverwrite (deepCopy $.Values.defaults.ingress.tls) (dig "ingress" "tls" dict $component) }}
{{- $annotations := dict }}
{{- if ne $path "/" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/rewrite-target" "/$2" }}
{{- end }}
{{- if $rateLimit.rps }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-rps" ($rateLimit.rps | toString) }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-burst-multiplier" ($rateLimit.burstMultiplier | toString) }}
{{- end }}
{{- $snippet := "" }}
{{- if $headers.enabled }}
  {{- range $header, $value := dict "Strict-Transport-Security" $headers.hsts "X-Content-Type-Options" $headers.contentTypeOptions "Referrer-Policy" $headers.referrerPolicy "X-Frame-Options" $headers.frameOptions "Permissions-Policy" $headers.permissionsPolicy }}
    {{- if $value }}
    {{- $snippet = printf "%smore_set_headers \"%s: %s\";\n" $snippet $header $value }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $key, $value := dig "ingress" "annotations" dict $component }}
  {{- if eq $key "nginx.ingress.kubernetes.io/configuration-snippet" }}
    {{- $snippet = printf "%s%s" $snippet $value }}
  {{- else }}
    {{- $_ := set $annotations $key $value }}
  {{- end }}
{{- end }}
{{- if $snippet }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/configuration-snippet" $snippet }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-{{ $componentNameValue }}
  labels:
    {{- include "app.componentLabels" (dict "root" $ "component" $component "name" $componentNameValue) | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $ingressClassName := $.Values.defaults.ingress.className }}
  {{- if hasKey $component "ingress" }}
  {{- if $component.ingress.className }}
  {{- $ingressClassName = $component.ingress.className }}
  {{- end }}
  {{- end }}
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $component.host | quote }}
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $component.host | quote }}
      http:
        paths:
          - path: {{ $path }}
            pathType: {{ if ne $path "/" }}ImplementationSpecific{{ else }}Prefix{{ end }}
            backend:
              service:
                name: {{ $fullName }}-{{ $componentNameValue }}
                port:
                  number: {{ $svcPort }}
{{- end }}
{{- end }} 